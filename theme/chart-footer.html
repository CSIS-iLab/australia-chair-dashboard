<!-- Quotable charts: a small gray line under each chart with how recent the
     data are, a CSV download of the data behind the chart, and the chart
     image. The data come from theme/chart-data.lua. -->
<script>
(function () {
  function download(href, name) {
    var a = document.createElement("a");
    a.href = href; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }

  // Charts only: images with a title, not the Home page tiles
  document.querySelectorAll(".card-body img[title]").forEach(function (img) {
    if (img.closest(".ov-card")) return;
    var card = img.closest(".card");
    if (!card || card.querySelector(":scope > .chart-quote")) return;
    var file = (img.getAttribute("data-csv-name") || "chart").replace(/(_data)?\.csv$/, "");

    var bar = document.createElement("div");
    bar.className = "chart-quote";
    var parts = [];
    if (img.dataset.period) parts.push('<span>Data to ' + img.dataset.period + '</span>');
    if (img.dataset.csv) parts.push('<button type="button" data-act="csv">Download data (CSV' +
                                    (img.dataset.usd ? ", A$" : "") + ')</button>');
    parts.push('<button type="button" data-act="png">Download chart</button>');
    bar.innerHTML = parts.join('<span class="sep" aria-hidden="true">&middot;</span>');

    bar.addEventListener("click", function (e) {
      var b = e.target.closest("button");
      if (!b) return;
      var act = b.getAttribute("data-act");
      if (act === "csv") download(img.dataset.csv, file + ".csv");
      if (act === "png") download(img.src, file + (img.src === img.dataset.usd ? "_usd" : "") + ".png");
    });
    card.appendChild(bar);
  });
})();
</script>
<!-- Hover tooltips on charts that have a hover map (data-hover, from
     theme/chart-hover.lua): the values under the pointer in a small box.
     The map gives rectangles as fractions of the image, so it fits the chart
     at any size, including the expanded (full-screen) view. -->
<style>
.chart-tip {
  position: fixed; z-index: 2000; pointer-events: none; display: none;
  max-width: 280px; padding: 6px 9px; border-radius: 4px;
  background: #00205B; color: #FFFFFF; font-size: 0.8rem; line-height: 1.35;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
}
img[data-hover] { cursor: crosshair; }
img[data-zoom] { cursor: zoom-in; }
img[data-zoom][data-zoomed="true"] { cursor: zoom-out; }
.chart-zoom-btn { font-weight: 700; }
</style>
<script>
(function () {
  var tip = document.createElement("div");
  tip.className = "chart-tip";
  tip.setAttribute("role", "tooltip");
  document.body.appendChild(tip);

  // The browser's own tooltip (the chart title) would cover the values
  document.querySelectorAll("img[data-hover][title]").forEach(function (img) {
    if (!img.getAttribute("aria-label")) img.setAttribute("aria-label", img.getAttribute("title"));
    img.removeAttribute("title");
  });

  function spots(img) {
    var zoomed = img.dataset.zoomed === "true" && img.dataset.hoverZoom;
    var usd = !zoomed && img.dataset.hoverUsd && img.getAttribute("src") === img.dataset.usd;
    var key = zoomed ? "_spotsZoom" : usd ? "_spotsUsd" : "_spots";
    if (!img[key]) {
      try { img[key] = JSON.parse(zoomed ? img.dataset.hoverZoom : usd ? img.dataset.hoverUsd : img.dataset.hover); }
      catch (e) { img[key] = []; }
    }
    return img[key];
  }

  // Zoomable charts (data-zoom, from theme/chart-hover.lua): the full range is
  // shown first; clicking the chart, or the button under it, switches to the
  // zoomed-in version and back. The hover map follows the picture shown.
  document.querySelectorAll("img[data-zoom]").forEach(function (img) {
    var full = img.getAttribute("src");
    var label = img.getAttribute("aria-label") || "";
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "chart-zoom-btn";
    function set(zoomed) {
      img.dataset.zoomed = zoomed ? "true" : "false";
      img.setAttribute("src", zoomed ? img.dataset.zoom : full);
      img.setAttribute("aria-label", label + (zoomed
        ? " Zoomed in on growth in ordinary years; the largest swings run off the scale (values in the subtitle)."
        : " Showing the full range of growth rates, including the COVID-19 swings."));
      btn.textContent = zoomed ? "Show full range" : "Zoom in on growth";
      btn.setAttribute("aria-pressed", zoomed ? "true" : "false");
      img.title = "";
      hide();
    }
    function toggle() { set(img.dataset.zoomed !== "true"); }
    img.addEventListener("click", toggle);
    btn.addEventListener("click", toggle);
    var card = img.closest(".card");
    var bar = card && card.querySelector(":scope > .chart-quote");
    if (bar) {
      var sep = document.createElement("span");
      sep.className = "sep"; sep.setAttribute("aria-hidden", "true"); sep.innerHTML = "&middot;";
      bar.insertBefore(sep, bar.firstChild); bar.insertBefore(btn, bar.firstChild);
    } else img.after(btn);
    set(false);
  });

  // Position of the pointer on the picture itself, as fractions; images are
  // drawn with object-fit: contain, so allow for any letterboxing.
  function where(img, e) {
    var r = img.getBoundingClientRect();
    var nw = img.naturalWidth, nh = img.naturalHeight;
    if (!nw || !nh) return null;
    var s = Math.min(r.width / nw, r.height / nh);
    var w = nw * s, h = nh * s;
    return { x: (e.clientX - r.left - (r.width - w) / 2) / w,
             y: (e.clientY - r.top - (r.height - h) / 2) / h, w: w, h: h };
  }

  function hide() { tip.style.display = "none"; }

  document.addEventListener("mousemove", function (e) {
    var img = e.target.closest && e.target.closest("img[data-hover]");
    if (!img) { hide(); return; }
    var p = where(img, e);
    var hit = null;
    if (p) {
      // Data points (zero-size spots): the nearest within NEAR pixels.
      // Areas (bars): the one under the pointer.
      var NEAR = 10, best = NEAR;
      spots(img).forEach(function (s) {
        if (s.x0 === s.x1 && s.y0 === s.y1) {
          var d = Math.hypot((p.x - s.x0) * p.w, (p.y - s.y0) * p.h);
          if (d <= best) { best = d; hit = s; }
        } else if (!hit && p.x >= s.x0 && p.x <= s.x1 && p.y >= s.y0 && p.y <= s.y1) {
          hit = s;
        }
      });
    }
    if (!hit) { hide(); return; }
    tip.innerHTML = hit.text;
    tip.style.display = "block";
    var x = e.clientX + 14, y = e.clientY + 14;
    if (x + tip.offsetWidth > window.innerWidth - 8) x = e.clientX - tip.offsetWidth - 14;
    if (y + tip.offsetHeight > window.innerHeight - 8) y = e.clientY - tip.offsetHeight - 14;
    tip.style.left = x + "px";
    tip.style.top = y + "px";
  });
  document.addEventListener("scroll", hide, true);
})();
</script>
