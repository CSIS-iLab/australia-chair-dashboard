<!-- Added to the end of the dashboard by '2. Australia Chair Tool.qmd'
     (include-after-body). It first loads the Google Fonts (section 0), then three
     jobs (the third, the Edition menu, is at the end):
     1. Groups some pages into drop-down menus in the top bar.
     2. Adds the A$ / US$ toggle at the left of the top bar. Charts with a US$
        version carry it in data-usd (see theme/currency.lua); headline numbers
        carry both versions in data-aud-text / data-usd-text. -->
<script>
// ---- 0. Fonts: Source Sans 3 and Source Serif 4 from Google Fonts --------
// Added to the page head when it opens rather than @import-ed in
// theme/csis-redesign.scss, so the font files are not embedded in the HTML.
// Until they arrive (or if offline) the fallbacks in the SCSS are used.
(function () {
  var href = "https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700" +
             "&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap";
  if (document.querySelector('link[href="' + href + '"]')) return;
  [["https://fonts.googleapis.com", false], ["https://fonts.gstatic.com", true]].forEach(function (o) {
    var pc = document.createElement("link");
    pc.rel = "preconnect"; pc.href = o[0];
    if (o[1]) pc.crossOrigin = "anonymous";
    document.head.appendChild(pc);
  });
  var link = document.createElement("link");
  link.rel = "stylesheet"; link.href = href;
  document.head.appendChild(link);
})();
</script>
<script>
(function () {
  // ---- 1. Drop-down menus ------------------------------------------------
  // Menu label, then the pages in it: [page id, name shown in the menu].
  // Page ids are the page titles in the .qmd, lower case, spaces as hyphens.
  var MENUS = [
    ["Trade",      [["trade-overview", "Trade Overview"],
                    ["trade-in-goods", "Trade in Goods"],
                    ["trade-in-services", "Trade in Services"]]],
    // Nov 2026: data centers and intellectual property sit under Investment
    ["Investment", [["investment", "Foreign Investment"],
                    ["data-centers", "Data Centers"],
                    ["intellectual-property", "Intellectual Property"]]]
  ];

  var navList = document.querySelector(".navbar .navbar-nav");
  if (navList) {
    MENUS.forEach(function (menu, m) {
      var links = menu[1].map(function (p) {
        return navList.querySelector('.nav-link[data-bs-target="#' + p[0] + '"]');
      }).filter(Boolean);
      if (!links.length) return;

      var li = document.createElement("li");
      li.className = "nav-item dropdown";
      var toggle = document.createElement("a");
      toggle.className = "nav-link dropdown-toggle";
      toggle.href = "#";
      toggle.id = "nav-menu-" + m;
      toggle.setAttribute("role", "button");
      toggle.setAttribute("data-bs-toggle", "dropdown");
      toggle.setAttribute("aria-expanded", "false");
      toggle.innerHTML = '<span class="nav-link-text">' + menu[0] + "</span>";
      var ul = document.createElement("ul");
      ul.className = "dropdown-menu";
      ul.setAttribute("aria-labelledby", toggle.id);

      // The menu takes the place of its first page in the bar.
      links[0].closest("li").before(li);
      links.forEach(function (a) {
        var label = menu[1].filter(function (p) {
          return a.getAttribute("data-bs-target") === "#" + p[0];
        })[0][1];
        var oldLi = a.closest("li");
        a.classList.add("dropdown-item");
        a.querySelector(".nav-link-text").textContent = label;
        var item = document.createElement("li");
        item.appendChild(a);
        ul.appendChild(item);
        oldLi.remove();
      });
      li.appendChild(toggle);
      li.appendChild(ul);
    });

    // Highlight the menu whose page is showing.
    function markMenus() {
      navList.querySelectorAll(".nav-item.dropdown").forEach(function (li) {
        var on = !!li.querySelector(".dropdown-item.active");
        li.querySelector(".dropdown-toggle").classList.toggle("menu-active", on);
      });
    }
    navList.addEventListener("shown.bs.tab", markMenus);
    // Bootstrap's own tab handler doesn't fire for links moved into a menu,
    // so open the page here, close the menu and keep the address in step.
    navList.addEventListener("click", function (e) {
      var a = e.target.closest(".dropdown-item");
      if (!a) return;
      e.preventDefault();
      bootstrap.Tab.getOrCreateInstance(a).show();
      var t = a.closest(".dropdown").querySelector(".dropdown-toggle");
      bootstrap.Dropdown.getOrCreateInstance(t).hide();
      history.replaceState(null, "", a.getAttribute("href"));
      window.scrollTo(0, 0);
      markMenus();
    });
    markMenus();
  }

  // ---- 1b. CSIS link at the right-hand end of the top bar ----------------------
  var collapse = document.querySelector(".navbar .navbar-collapse");
  if (collapse) {
    var csis = document.createElement("a");
    csis.className = "csis-link";
    csis.href = "https://www.csis.org/programs/australia-chair";
    csis.target = "_blank";
    csis.rel = "noopener";
    csis.innerHTML = "CSIS <span>Australia Chair</span>";
    collapse.appendChild(csis);
  }

  // ---- 1b2. "Print this tab" button (Nov 2026) ---------------------------------
  // Prints only the page that is showing, with each card's visible tab, laid
  // out for paper (see the @media print rules in theme/csis-redesign.scss).
  // A heading naming the page is added for the printout.
  if (collapse) {
    var pr = document.createElement("button");
    pr.type = "button";
    pr.className = "print-tab";
    pr.title = "Print the page that is showing";
    pr.innerHTML = '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" fill="currentColor">' +
      '<path d="M4 1h8v4H4zM2 6h12a1 1 0 0 1 1 1v5h-3v3H4v-3H1V7a1 1 0 0 1 1-1zm3 5v3h6v-3zM12 8.5a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5z"/></svg>' +
      '<span>Print this tab</span>';
    var csisLink = collapse.querySelector(".csis-link");
    if (csisLink) csisLink.before(pr); else collapse.appendChild(pr);
    var printHead = function () {
      var old = document.querySelector(".print-head");
      if (old) old.remove();
      var page = document.querySelector(".dashboard-page.active, .tab-pane.active.dashboard-page") ||
                 document.querySelector(".dashboard-page.show");
      var link = document.querySelector('.navbar .nav-link.active .nav-link-text');
      var name = link ? link.textContent.trim() : "";
      var h = document.createElement("div");
      h.className = "print-head";
      h.innerHTML = '<div class="print-kicker">CSIS Australia Chair &middot; U.S.-Australia Economic Dashboard</div>' +
                    '<div class="print-title">' + name + '</div>' +
                    '<div class="print-url">' + location.href.replace(/</g, "") + ' &middot; printed ' +
                    new Date().toLocaleDateString("en-US", { day: "numeric", month: "long", year: "numeric" }) + '</div>';
      if (page) page.prepend(h);
    };
    window.addEventListener("beforeprint", printHead);
    pr.addEventListener("click", function () { printHead(); window.print(); });
  }

  // ---- 1d. Annual / Quarterly toggle (Nov 2026) --------------------------------
  // Cards marked .view-toggle and .view-<Label> (e.g. .view-Annual) that sit in one
  // tab are shown one at a time, with tabs above them styled like the
  // Goods/Services tabs. The first card is shown first.
  (function () {
    var groups = [];
    document.querySelectorAll(".card.view-toggle").forEach(function (c) {
      var parent = c.parentElement;
      var g = groups.filter(function (x) { return x.parent === parent; })[0];
      if (!g) { g = { parent: parent, cards: [] }; groups.push(g); }
      g.cards.push(c);
    });
    groups.forEach(function (g) {
      var ul = document.createElement("ul");
      ul.className = "nav nav-tabs view-toggle-tabs";
      ul.setAttribute("role", "tablist");
      g.cards.forEach(function (c, i) {
        var li = document.createElement("li"); li.className = "nav-item";
        var a = document.createElement("a"); a.className = "nav-link" + (i === 0 ? " active" : "");
        a.href = "#"; a.setAttribute("role", "tab");
        a.textContent = ([].filter.call(c.classList, function (k) { return /^view-[A-Z]/.test(k); })[0] || "view-View").slice(5);
        a.addEventListener("click", function (e) {
          e.preventDefault();
          ul.querySelectorAll(".nav-link").forEach(function (x) { x.classList.toggle("active", x === a); });
          g.cards.forEach(function (x) { x.classList.toggle("view-hidden", x !== c); });
          window.dispatchEvent(new Event("resize"));
        });
        li.appendChild(a); ul.appendChild(li);
        if (i > 0) c.classList.add("view-hidden");
      });
      g.parent.insertBefore(ul, g.cards[0]);
      g.parent.classList.add("view-toggle-host");
    });
  })();

  // ---- 1c. Critical minerals: the filters are for the map only -------------
  // The page's sidebar (end-use family, lifecycle stage) filters the map, so
  // it is hidden, and the charts take the full width, on the other tabs.
  var cm = document.getElementById("critical-minerals");
  var cmLayout = cm && cm.querySelector(".bslib-sidebar-layout");
  if (cmLayout) {
    var cmSync = function () {
      var active = cm.querySelector(".nav-tabs .nav-link.active");
      var onMap = !active || /^\s*Map\s*$/.test(active.textContent);
      cmLayout.classList.toggle("cm-no-sidebar", !onMap);
      window.dispatchEvent(new Event("resize"));            // let the map and charts refit
    };
    cm.addEventListener("shown.bs.tab", cmSync);
    cmSync();
  }

  // ---- 2. A$ / US$ toggle ----------------------------------------------------
  var KEY = "csis-au-tool-currency";
  var bar = document.querySelector(".navbar .navbar-brand-container");
  var box = document.createElement("div");
  box.className = "cur-toggle";
  box.setAttribute("role", "group");
  box.setAttribute("aria-label", "Currency for all charts");
  box.innerHTML =
    '<button type="button" data-cur="USD" title="Show all charts in US dollars">$USD</button>' +
    '<button type="button" data-cur="AUD" title="Show all charts in Australian dollars">$AUD</button>';
  if (bar) bar.after(box);

  function apply(cur) {
    document.documentElement.setAttribute("data-currency", cur);
    document.querySelectorAll("img[data-usd]").forEach(function (img) {
      if (!img.dataset.aud) img.dataset.aud = img.getAttribute("src");
      img.setAttribute("src", cur === "USD" ? img.dataset.usd : img.dataset.aud);
    });
    document.querySelectorAll("[data-usd-text]").forEach(function (el) {
      el.innerHTML = cur === "USD" ? el.dataset.usdText : el.dataset.audText;
    });
    // Chart alt text (theme/chart-data.lua) follows the currency too
    document.querySelectorAll("img[data-aria-usd]").forEach(function (img) {
      img.setAttribute("aria-label", cur === "USD" ? img.dataset.ariaUsd : img.dataset.ariaAud);
    });
    box.querySelectorAll("button").forEach(function (b) {
      var on = b.dataset.cur === cur;
      b.classList.toggle("is-on", on);
      b.setAttribute("aria-pressed", on);
    });
    document.documentElement.classList.remove("cur-wait");  // see currency-early.html
  }

  box.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    apply(b.dataset.cur);
    // Only a visitor's own choice is remembered, so the default can change later
    try { localStorage.setItem(KEY, b.dataset.cur); } catch (e) {}
  });

  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  apply(saved === "AUD" ? "AUD" : "USD");   // US$ by default; a saved choice wins

  // ---- 3. Edition menu: earlier quarters of the dashboard ---------------------
  // Each quarter's dashboard is filed in editions/ by '3. Editions.R' and
  // listed in editions/editions.json. The menu appears once there is at least
  // one earlier edition; it needs the published site (not a file opened from
  // disk), because it reads editions.json.
  var stamp = document.getElementById("csis-edition");
  if (!stamp) return;
  var archived = stamp.dataset.archived === "true";
  var here = stamp.dataset.id;
  var base = archived ? "" : "editions/";
  var latestHref = archived ? "../2.%20Australia%20Chair%20Tool.html" : null;

  if (archived) {
    var banner = document.createElement("div");
    banner.className = "edition-banner";
    banner.innerHTML = "You are viewing the <b>" + stamp.dataset.label + " edition</b> (data to " +
      stamp.dataset.dataTo + "). <a href=\"" + latestHref + "\">Go to the latest edition &rarr;</a>";
    var nav = document.querySelector(".navbar");
    if (nav) nav.after(banner);
  }

  fetch(base + "editions.json", { cache: "no-cache" })
    .then(function (r) { return r.ok ? r.json() : []; })
    .then(function (list) {
      if (!Array.isArray(list) || !list.length) return;
      var wrap = document.createElement("div");
      wrap.className = "edition-menu dropdown";
      var items = '<li><a class="dropdown-item' + (archived ? "" : " active") + '" href="' +
        (archived ? latestHref : "#") + '">Latest (' + (archived ? "current" : stamp.dataset.label) + ')</a></li>';
      list.forEach(function (ed) {
        items += '<li><a class="dropdown-item' + (ed.id === here && archived ? " active" : "") +
          '" href="' + base + ed.file + '">' + ed.label + ' <small>data to ' + ed.data_to + '</small></a></li>';
      });
      wrap.innerHTML = '<button class="edition-toggle dropdown-toggle" type="button" data-bs-toggle="dropdown" ' +
        'aria-expanded="false" title="Earlier quarterly editions of the dashboard">Edition: ' +
        (archived ? stamp.dataset.label : "Latest") + '</button><ul class="dropdown-menu">' + items + "</ul>";
      box.after(wrap);
    })
    .catch(function () {});
})();
</script>
